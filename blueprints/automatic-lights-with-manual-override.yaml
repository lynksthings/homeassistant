blueprint:
  name: Automatic lights with manual override (Restored Logic)
  description: >-
    Automatic lights using motion/presence sensors with smart manual override (Bypass).
    Restored exact original logic for context filtering and presence checks.
  domain: automation
  author: Alex Soto Aguilera
  source_url: https://raw.githubusercontent.com/lynksthings/homeassistant/main/blueprints/automatic-lights-with-manual-override.yaml
  homeassistant:
    min_version: 2024.8.0

  input:
    trigger_on_sensor:
      name: Trigger On Sensor (Binary Sensor)
      description: Sensor responsible for turning lights ON.
      selector:
        entity:
          filter:
            domain: binary_sensor
          multiple: false

    trigger_off_sensor:
      name: Trigger Off Sensor (Binary Sensor)
      description: Sensor responsible for turning lights OFF.
      selector:
        entity:
          filter:
            domain: binary_sensor
          multiple: false

    lights:
      name: Target Lights / Switches
      description: Lights or switches controlled by this automation.
      selector:
        entity:
          filter:
            domain:
              - light
              - switch
          multiple: true

    include_bypass:
      name: Use Bypass Option
      default: bypass_disabled
      selector:
        select:
          options:
            - label: Enable Bypass Option
              value: bypass_enabled
            - label: Disable Bypass Option
              value: bypass_disabled

    bypass_input_boolean:
      name: Bypass Helper (Input Boolean)
      default: []
      selector:
        entity:
          filter:
            domain: input_boolean
          multiple: false

    bypass_auto_off_delay:
      name: Bypass Auto OFF Delay (Minutes)
      default: 30
      selector:
        number:
          min: 1
          max: 240
          step: 1
          unit_of_measurement: minutes

    include_sun:
      name: Use Sun Condition
      default: sun_disabled
      selector:
        select:
          options:
            - label: Enable Sun Option
              value: sun_enabled
            - label: Disable Sun Option
              value: sun_disabled

    sun_elevation:
      name: Sun Elevation Falling
      default: -1.5
      selector:
        number:
          min: -10
          max: 5
          step: 0.5
          unit_of_measurement: degrees

    sun_elevation_rising:
      name: Sun Elevation Rising
      default: -4.0
      selector:
        number:
          min: -10
          max: 5
          step: 0.5
          unit_of_measurement: degrees

    include_illuminance:
      name: Use Illuminance Condition
      default: illuminance_disabled
      selector:
        select:
          options:
            - label: Enable Illuminance Option
              value: illuminance_enabled
            - label: Disable Illuminance Option
              value: illuminance_disabled

    illuminance_sensor:
      name: Illuminance Sensor
      default: []
      selector:
        entity:
          filter:
            domain: sensor
            device_class: illuminance

    illuminance_value:
      name: Low Lux Threshold
      default: 2500
      selector:
        number:
          min: 0
          max: 10000
          step: 10
          unit_of_measurement: lux

    include_time:
      name: Use Time Condition
      default: time_disabled
      selector:
        select:
          options:
            - label: Enable Time Option
              value: time_enabled
            - label: Disable Time Option
              value: time_disabled

    after_time:
      name: Start Time
      default: "00:00:00"
      selector:
        time: {}

    before_time:
      name: End Time
      default: "00:00:00"
      selector:
        time: {}

    weekday_options:
      name: Weekdays
      default:
        - mon
        - tue
        - wed
        - thu
        - fri
        - sat
        - sun
      selector:
        select:
          multiple: true
          mode: list
          options:
            - label: Monday
              value: mon
            - label: Tuesday
              value: tue
            - label: Wednesday
              value: wed
            - label: Thursday
              value: thu
            - label: Friday
              value: fri
            - label: Saturday
              value: sat
            - label: Sunday
              value: sun

triggers:
  - trigger: state
    entity_id: !input trigger_on_sensor
    from: "off"
    to: "on"
    id: trigger_sensor_turn_on

  - trigger: state
    entity_id: !input trigger_off_sensor
    from: "on"
    to: "off"
    id: trigger_sensor_turn_off

  - trigger: state
    entity_id: !input lights
    from: "off"
    to: "on"
    id: lights_turn_on

  - trigger: state
    entity_id: !input lights
    from: "on"
    to: "off"
    id: lights_turn_off

  - trigger: state
    entity_id: !input bypass_input_boolean
    from: "off"
    to: "on"
    id: bypass_state_change_to_on
    for:
      hours: 0
      minutes: !input bypass_auto_off_delay
      seconds: 0

  - trigger: state
    entity_id: !input bypass_input_boolean
    from: "on"
    to: "off"
    id: bypass_state_change_to_off

variables:
  trigger_on_sensor: !input trigger_on_sensor
  trigger_off_sensor: !input trigger_off_sensor
  include_bypass: !input include_bypass
  bypass_input_boolean: !input bypass_input_boolean
  include_sun: !input include_sun
  sun_elevation: !input sun_elevation
  sun_elevation_rising: !input sun_elevation_rising
  include_illuminance: !input include_illuminance
  illuminance_sensor: !input illuminance_sensor
  illuminance_value: !input illuminance_value
  include_time: !input include_time

actions:
  - choose:
      # OPTION 1: TURN LIGHTS ON (Sensor triggered or Bypass turned off with presence)
      - conditions:
          - condition: template
            value_template: >-
              {{
                trigger.id == 'trigger_sensor_turn_on' or
                (
                  trigger.id == 'bypass_state_change_to_off' and
                  include_bypass == 'bypass_enabled'
                )
              }}
          - condition: state
            entity_id: !input lights
            state: "off"
          - condition: state
            entity_id: !input trigger_on_sensor
            state: "on"
          - condition: template
            value_template: >-
              {{
                include_bypass == 'bypass_disabled' or
                states(bypass_input_boolean) == 'off'
              }}
          # Environmental conditions (Sun, Illuminance, Time)
          - condition: template
            value_template: >-
              {{
                include_sun == 'sun_disabled' or
                (is_state_attr('sun.sun', 'rising', false) and state_attr('sun.sun', 'elevation') | float(0) <= sun_elevation | float(0)) or
                (is_state_attr('sun.sun', 'rising', true) and state_attr('sun.sun', 'elevation') | float(0) <= sun_elevation_rising | float(0))
              }}
          - condition: template
            value_template: >-
              {{
                include_illuminance == 'illuminance_disabled' or
                states(illuminance_sensor) | float(99999) <= illuminance_value | float(0)
              }}
          - condition: or
            conditions:
              - condition: template
                value_template: "{{ include_time == 'time_disabled' }}"
              - condition: time
                after: !input after_time
                before: !input before_time
                weekday: !input weekday_options
        sequence:
          - action: homeassistant.turn_on
            target:
              entity_id: !input lights

      # OPTION 2: TURN LIGHTS OFF (Sensor cleared or Bypass turned off without presence)
      - conditions:
          - condition: template
            value_template: >-
              {{
                trigger.id == 'trigger_sensor_turn_off' or
                (
                  trigger.id == 'bypass_state_change_to_off' and
                  include_bypass == 'bypass_enabled'
                )
              }}
          - condition: state
            entity_id: !input lights
            state: "on"
          - condition: state
            entity_id: !input trigger_off_sensor
            state: "off"
          - condition: template
            value_template: >-
              {{
                include_bypass == 'bypass_disabled' or
                states(bypass_input_boolean) == 'off'
              }}
        sequence:
          - action: homeassistant.turn_off
            target:
              entity_id: !input lights

      # OPTION 3: TURN BYPASS ON (Manual switch press detected)
      - conditions:
          - condition: template
            value_template: "{{ include_bypass == 'bypass_enabled' }}"
          - condition: template
            value_template: "{{ states(bypass_input_boolean) == 'off' }}"
          - condition: template
            value_template: "{{ trigger.id in ['lights_turn_on', 'lights_turn_off'] }}"
          - condition: template
            value_template: >-
              {{
                trigger.to_state.context.user_id is none and
                (
                  trigger.to_state.context.parent_id is none or
                  (trigger.id == 'lights_turn_off' and states(trigger_on_sensor) == 'on') or
                  (trigger.id == 'lights_turn_on' and states(trigger_off_sensor) == 'off')
                )
              }}
        sequence:
          - action: input_boolean.turn_on
            target:
              entity_id: !input bypass_input_boolean

      # OPTION 4: TURN BYPASS OFF (Auto-timer expired)
      - conditions:
          - condition: template
            value_template: "{{ include_bypass == 'bypass_enabled' }}"
          - condition: trigger
            id: bypass_state_change_to_on
          - condition: template
            value_template: "{{ trigger.to_state.context.user_id is none }}"
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: !input bypass_input_boolean

mode: restart
