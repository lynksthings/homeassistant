blueprint:
  name: Smart Button (Event Entities)
  description: >-
    Configure Smart Button with Event Entities with filter for Zigbee2MQTT restarts.
  domain: automation
  author: Alex Soto Aguilera
  source_url: https://raw.githubusercontent.com/lynksthings/homeassistant/main/blueprints/smartbutton-mqtt-event-entities.yaml
  homeassistant:
    min_version: 2022.8.0

  input:
    event_entity:
      name: Button Event Entity
      description: >-
        Select `event.button_name_action`
      selector:
        entity:
          domain: event
          multiple: false

    actions_single:
      name: Single Tap Actions
      selector:
        action: {}

    actions_double:
      name: Double Tap Actions
      selector:
        action: {}

    actions_hold:
      name: Hold Tap Actions
      selector:
        action: {}

trigger:
  - platform: state
    entity_id: !input event_entity

condition:
  - condition: template
    value_template: >-
      {{ trigger.to_state is not none and
         trigger.to_state.state not in ['unavailable', 'unknown'] }}

action:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger.to_state.attributes.event_type in ['single', 'press', 'toggle'] }}"
        sequence: !input actions_single

      - conditions:
          - condition: template
            value_template: "{{ trigger.to_state.attributes.event_type in ['double', 'double_click'] }}"
        sequence: !input actions_double

      - conditions:
          - condition: template
            value_template: "{{ trigger.to_state.attributes.event_type in ['hold', 'long_press', 'long'] }}"
        sequence: !input actions_hold

mode: single
